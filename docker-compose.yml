# Two services from one image: the desk, and a loop that backs its database up.
#
#   docker compose up -d --build     start
#   docker compose logs -f desk      watch
#   docker compose down              stop
#
# Credentials are read from .env at run time and never enter the image - see
# .dockerignore, which excludes it from the build context entirely.

services:
  desk:
    build: .
    image: option-desk
    # Loopback only. This holds live broker credentials and can place real
    # orders; binding 0.0.0.0 would expose it to anything on the network.
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    volumes:
      # The database and its backups outlive the container.
      - ./data:/app/data
      # Fyers writes its own request logs into the working directory.
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  backup:
    # Same image, different command: no second build, no extra dependency.
    image: option-desk
    depends_on:
      - desk
    command: ["python", "scripts/backup_db.py", "--loop"]
    environment:
      BACKUP_EVERY_HOURS: "4"
      BACKUP_KEEP: "24"    # four days at four-hourly
    volumes:
      - ./data:/app/data
    restart: unless-stopped
